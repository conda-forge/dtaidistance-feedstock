context:
  version: "2.5.1"

package:
  name: dtaidistance
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dtaidistance/dtaidistance-${{ version }}.tar.gz
  sha256: 707c7d323bafa4f5e835f15b6e3410fe628e5076506cb67248049e90a18e3a18
  patches:
    - force-cythonize.patch

build:
  script: python -m pip install . -vv
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - cython
        - numpy
        - python
    - if: linux
      then:
        - libgomp
    - if: osx
      then:
        - llvm-openmp
  host:
    - cython
    - numpy
    - pip
    - python
    - setuptools
    - wheel
  run:
    - matplotlib-base >=3.0.0
    - numpy
    - python
    - scipy

tests:
  - python:
      imports:
        - dtaidistance
        - dtaidistance.clustering
        - dtaidistance.dtw
        - dtaidistance.dtw_cc
        - dtaidistance.dtw_cc_numpy
        - dtaidistance.dtw_cc_omp
        - dtaidistance.ed_cc
      pip_check: true

about:
  homepage: https://github.com/wannesm/dtaidistance
  summary: 'Distance measures for time series (Dynamic Time Warping, fast C implementation)'
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://dtaidistance.readthedocs.io/en/latest/
  repository: https://github.com/wannesm/dtaidistance

extra:
  recipe-maintainers:
    - m-rossi
    - wannesm
